name: Atualizar dados do Monitor Guaxanduva

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: monitor-guaxanduva-operacional
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow paho-mqtt
      - name: Atualizar estado operacional
        run: python atualizar_operacional.py
      - name: Calcular Guaxanduva Fusion #175
        run: python fusion_guaxanduva_175.py
      - name: Publicar dados operacionais
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp dados.json /tmp/dados-operacional.json
          cp fusion_guaxanduva_175.json /tmp/fusion-guaxanduva-175.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/dados-operacional.json dados.json
          cp /tmp/fusion-guaxanduva-175.json fusion_guaxanduva_175.json
          git add dados.json fusion_guaxanduva_175.json
          if git diff --cached --quiet; then
            echo "Dados operacionais já publicados."
            exit 0
          fi
          git commit -m "Atualiza estado operacional do Monitor Guaxanduva"
          for tentativa in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/dados-operacional.json dados.json
            cp /tmp/fusion-guaxanduva-175.json fusion_guaxanduva_175.json
            git add dados.json fusion_guaxanduva_175.json
            git diff --cached --quiet && exit 0
            git commit -m "Atualiza estado operacional do Monitor Guaxanduva"
          done
          exit 1
