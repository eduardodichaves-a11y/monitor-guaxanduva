name: Testar Monitor Oceânico #174

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-guaxanduva-174-experimental
  cancel-in-progress: true

jobs:
  testar-174:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependência mínima
        run: pip install requests
      - name: Executar motor experimental #174-H
        run: python -u monitor_oceanico_174.py --saida monitor_oceanico_174.json --timeout 4 --tentativas 13
      - name: Validar saída fail-closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("monitor_oceanico_174.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d.get("versao") == "#174-H"
          assert d.get("uso_operacional") is False
          assert d.get("status") in {"experimental_dados_processados", "fonte_indisponivel_fail_closed"}
          if d.get("status") == "experimental_dados_processados":
              assert isinstance(d.get("sistemas"), list)
              for s in d["sistemas"]:
                  assert s.get("eta_liberado_como_previsao") is False
          if d.get("status") == "experimental_dados_processados":
              assert d.get("sistemas_geometricamente_compativeis") is None
              assert isinstance(d.get("sistemas_aproximando_observado_continuo"), int)
              assert isinstance(d.get("sistemas_aproximando_com_apoio_sinotico_850hpa"), int)
              for s in d["sistemas"]:
                  if not s.get("velocidade_movimento_m_s"):
                      assert s.get("compatibilidade_trajetoria") == "SEM_VETOR_VALIDO"
              assert isinstance(d.get("sistemas_persistencia_30min_confirmada"), int)
              assert isinstance(d.get("sistemas_persistencia_60min_confirmada"), int)
              assert d.get("sistemas_persistencia_60min_confirmada") <= d.get("sistemas_persistencia_30min_confirmada")
              cs = d.get("confirmacao_sinotica") or {}
              pr = cs.get("prioridade") or {}
              assert int(pr.get("p60_selecionados", 0)) == min(int(pr.get("p60_disponiveis", 0)), 20)
              if int(pr.get("p60_disponiveis", 0)) <= 20:
                  for s in d["sistemas"]:
                      if s.get("persistencia_60min") == "CONFIRMADA" and s.get("tendencia_distancia_observada") == "APROXIMANDO_OBSERVADO_CONTINUO":
                          assert s.get("prioridade_sinotica_174g") == "P60"
                          assert s.get("estado_sinotico_174f") != "NAO_AVALIADO"
              assert cs.get("status") in {"coletado", "coletado_parcial", "fonte_indisponivel_fail_closed", "sem_candidatos_continuos"}
              assert int(cs.get("contrarios", 0)) == int(cs.get("nao_apoiam", 0))
              assert int(cs.get("favoraveis", 0)) == int(cs.get("apoiam", 0))
              for s in d["sistemas"]:
                  if s.get("estado_sinotico_174f") == "FONTE_INDISPONIVEL":
                      assert s.get("confirmacao_sinotica_850hpa") in {"FONTE_INDISPONIVEL", "SEM_AMOSTRA_MODELO"}
          # #174-H: todo P60 selecionado e avaliado deve carregar o novo gate de 3h.
              for s in d["sistemas"]:
                  if s.get("persistencia_60min") == "CONFIRMADA" and s.get("prioridade_sinotica_174g") == "P60":
                      assert s.get("persistencia_sinotica_174h") in {"FAVORAVEL_PERSISTENTE_3H", "CONTRARIO_PERSISTENTE_3H", "FAVORAVEL_NAO_PERSISTENTE", "OSCILANTE_OU_INCONCLUSIVO", "FONTE_INDISPONIVEL_FAIL_CLOSED"}
                      assert isinstance(s.get("janela_sinotica_3h"), list) and len(s.get("janela_sinotica_3h")) == 3
              assert isinstance(d.get("sistemas_persistencia_60min_com_apoio_sinotico_persistente_3h"), int)
          print("VALIDAÇÃO #174-H OK:", d.get("status"), "sistemas=", d.get("sistemas_no_dominio"), "aproximando_continuo=", d.get("sistemas_aproximando_observado_continuo"), "apoio_850=", d.get("sistemas_aproximando_com_apoio_sinotico_850hpa"))
          PY
      - name: Publicar somente JSON experimental
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp monitor_oceanico_174.json /tmp/monitor_oceanico_174.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/monitor_oceanico_174.json monitor_oceanico_174.json
          git add monitor_oceanico_174.json
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza diagnóstico experimental do Monitor Oceânico #174"
          git push origin HEAD:main
