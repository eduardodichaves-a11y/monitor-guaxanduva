name: Atualizar dados do Monitor Guaxanduva

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: monitor-guaxanduva-operacional
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: |
          pip install --disable-pip-version-check requests beautifulsoup4 pillow paho-mqtt
      - name: Atualizar estado operacional
        run: python atualizar_operacional.py
      - name: Atualizar Monitor Oceânico #174
        run: python monitor_oceanico_174.py --timeout 4 --tentativas 13
      - name: Calcular Guaxanduva Fusion #175
        run: python fusion_guaxanduva_175.py
      - name: Calcular Estatística Operacional Contínua #190
        run: python estatisticas_operacionais_190.py
      - name: Arquivar ecos e cores RGB #217
        run: python registrar_ecos_rgb_217.py --dados dados.json --historico historico_ecos_rgb_217.json
      - name: Registrar e comparar núcleos RadarSC #231
        run: |
          python - <<'PY231'
          import json, subprocess, sys
          with open('dados.json', encoding='utf-8') as f:
              radar = (json.load(f).get('radar') or {})
          geo = ((radar.get('classificacao_qualitativa_local_130') or {})
                 .get('geolocalizacao_familias_230') or {})
          if radar.get('horario_ultimo_quadro') and isinstance(geo.get('nucleos'), list):
              subprocess.run([sys.executable, 'rastrear_nucleos_231.py',
                              'dados.json', 'historico_nucleos_231.json'], check=True)
          else:
              print('RadarSC sem núcleos #230 disponíveis: histórico #231 preservado.')
          PY231
      - name: Auditar cores RadarSC #232
        run: python auditar_cores_radarsc_232.py dados.json auditoria_cores_232.json
      - name: Auditar evidências da paleta RadarSC #233
        run: python auditar_evidencias_paleta_233.py dados.json auditoria_paleta_233.json
      - name: Publicar dados operacionais
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp dados.json /tmp/dados-operacional.json
          cp fusion_guaxanduva_175.json /tmp/fusion-guaxanduva-175.json
          cp monitor_oceanico_174.json /tmp/monitor-oceanico-174.json
          cp monitor_oceanico_174_dashboard.json /tmp/monitor-oceanico-174-dashboard.json
          cp historico_operacional_190.json /tmp/historico-operacional-190.json
          cp estatisticas_operacionais_190.json /tmp/estatisticas-operacionais-190.json
          cp historico_ecos_rgb_217.json /tmp/historico-ecos-rgb-217.json
          if [ -f historico_nucleos_231.json ]; then cp historico_nucleos_231.json /tmp/historico-nucleos-231.json; fi
          cp auditoria_cores_232.json /tmp/auditoria-cores-232.json
          cp auditoria_paleta_233.json /tmp/auditoria-paleta-233.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/dados-operacional.json dados.json
          cp /tmp/fusion-guaxanduva-175.json fusion_guaxanduva_175.json
          cp /tmp/monitor-oceanico-174.json monitor_oceanico_174.json
          cp /tmp/monitor-oceanico-174-dashboard.json monitor_oceanico_174_dashboard.json
          cp /tmp/historico-operacional-190.json historico_operacional_190.json
          cp /tmp/estatisticas-operacionais-190.json estatisticas_operacionais_190.json
          cp /tmp/historico-ecos-rgb-217.json historico_ecos_rgb_217.json
          if [ -f /tmp/historico-nucleos-231.json ]; then cp /tmp/historico-nucleos-231.json historico_nucleos_231.json; fi
          cp /tmp/auditoria-cores-232.json auditoria_cores_232.json
          cp /tmp/auditoria-paleta-233.json auditoria_paleta_233.json
          git add dados.json fusion_guaxanduva_175.json monitor_oceanico_174.json monitor_oceanico_174_dashboard.json historico_operacional_190.json estatisticas_operacionais_190.json historico_ecos_rgb_217.json historico_nucleos_231.json auditoria_cores_232.json auditoria_paleta_233.json
          if git diff --cached --quiet; then
            echo "Dados operacionais já publicados."
            exit 0
          fi
          git commit -m "Atualiza estado operacional do Monitor Guaxanduva"
          for tentativa in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            # #208: o GitHub pode responder 5xx temporariamente no push.
            # As tentativas antigas eram praticamente instantâneas; agora usamos
            # backoff progressivo antes de reconstruir o commit sobre origin/main.
            espera=$((tentativa * 15))
            echo "Push falhou (tentativa ${tentativa}/3). Aguardando ${espera}s antes de tentar novamente..."
            sleep "$espera"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/dados-operacional.json dados.json
            cp /tmp/fusion-guaxanduva-175.json fusion_guaxanduva_175.json
            cp /tmp/monitor-oceanico-174.json monitor_oceanico_174.json
            cp /tmp/monitor-oceanico-174-dashboard.json monitor_oceanico_174_dashboard.json
            cp /tmp/historico-operacional-190.json historico_operacional_190.json
            cp /tmp/estatisticas-operacionais-190.json estatisticas_operacionais_190.json
            cp /tmp/historico-ecos-rgb-217.json historico_ecos_rgb_217.json
            if [ -f /tmp/historico-nucleos-231.json ]; then cp /tmp/historico-nucleos-231.json historico_nucleos_231.json; fi
            cp /tmp/auditoria-cores-232.json auditoria_cores_232.json
            cp /tmp/auditoria-paleta-233.json auditoria_paleta_233.json
            git add dados.json fusion_guaxanduva_175.json monitor_oceanico_174.json monitor_oceanico_174_dashboard.json historico_operacional_190.json estatisticas_operacionais_190.json historico_ecos_rgb_217.json historico_nucleos_231.json auditoria_cores_232.json auditoria_paleta_233.json
            git diff --cached --quiet && exit 0
            git commit -m "Atualiza estado operacional do Monitor Guaxanduva"
          done
          exit 1
