name: Auditoria multifonte RadarSC 215

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Conferir scripts e dados
        run: |
          test -s dados.json
          python -m py_compile auditar_cruzamento_geografico_212.py auditar_territorio_ecos_213.py auditar_multifonte_215.py

      - name: Gerar auditoria geografica real
        run: |
          python auditar_cruzamento_geografico_212.py dados.json --saida auditoria_geografica_212.json

      - name: Gerar auditoria territorial real
        run: |
          python auditar_territorio_ecos_213.py auditoria_geografica_212.json --saida auditoria_territorial_213.json

      - name: Verificar se ha ecos atuais
        id: ecos
        run: |
          python - <<'PY'
          import json, os
          with open('auditoria_territorial_213.json', encoding='utf-8') as f:
              dados = json.load(f)
          quantidade = len(dados.get('agrupamentos') or [])
          print('Ecos atuais:', quantidade)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('presentes=' + ('true' if quantidade else 'false') + '\n')
          PY

      - name: Consultar modelo meteorologico para os ecos atuais
        if: steps.ecos.outputs.presentes == 'true'
        run: |
          python auditar_multifonte_215.py --territorio auditoria_territorial_213.json --saida auditoria_multifonte_215.json

      - name: Resumo cientifico
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          def ler(nome):
              p = Path(nome)
              if not p.is_file():
                  return None
              return json.loads(p.read_text(encoding='utf-8'))

          geografico = ler('auditoria_geografica_212.json')
          territorial = ler('auditoria_territorial_213.json')
          multifonte = ler('auditoria_multifonte_215.json')
          linhas = ['## Auditoria multifonte RadarSC #215 / RGB #216']
          if geografico is None:
              linhas.append('- Auditoria geografica: arquivo ausente; conferir etapa #212.')
          else:
              linhas.append(f"- Quadro RadarSC: {geografico.get('quadro_radar') or 'N/D'}")
              linhas.append(f"- Ecos identificados no dados.json: {geografico.get('total_agrupamentos', 0)}")
              linhas.append(f"- Gerado na fonte: {geografico.get('gerado_em_fonte') or 'N/D'}")
          if territorial is None:
              linhas.append('- Auditoria territorial: arquivo ausente; conferir etapa #213.')
          else:
              grupos = territorial.get('agrupamentos') or []
              linhas.append(f"- Ecos recebidos pela #213: {len(grupos)}")
              linhas.append(f"- Ecos com RGB preservado: {sum(bool(g.get('cores_rgb')) for g in grupos)}")
              if not grupos:
                  linhas.append('- Situacao: nenhum eco no quadro de entrada. Consulta multifonte ignorada.')
              for g in grupos:
                  linhas.append(f"### Eco {g.get('numero')} - {(g.get('territorio') or {}).get('municipio_provavel') or 'territorio N/D'}")
                  linhas.append(f"- RGB: {g.get('cores_rgb') or 'NAO DISPONIVEL'}")
                  linhas.append(f"- Familias: {g.get('familias_cromaticas') or 'NAO DISPONIVEL'}")
          if multifonte is None:
              if territorial is not None and not (territorial.get('agrupamentos') or []):
                  linhas.append('- Modelo meteorologico: nao consultado porque nao ha ecos.')
              else:
                  linhas.append('- Modelo meteorologico: relatorio ausente; conferir logs.')
          else:
              linhas.append(f"- Origem da auditoria multifonte: {multifonte.get('origem_ecos')}")
              linhas.append(f"- Calibracao de cores: {multifonte.get('calibracao_cores')}")
              for g in multifonte.get('agrupamentos') or []:
                  linhas.append(f"- Eco {g.get('numero')}: RGB {g.get('estado_rgb')}; chuva observada NAO CONFIRMADA")
                  for e in g.get('evidencias') or []:
                      linhas.append(f"  - {e.get('provedor')}: {e.get('status') or e.get('tipo') or 'N/D'}")
                      if e.get('erro'):
                          linhas.append(f"  - Erro: {e['erro']}")
                      for a in e.get('amostras') or []:
                          linhas.append(f"  - {a.get('horario_local')}: precipitacao={a.get('precipitation')} mm, chuva={a.get('rain')} mm, pancadas={a.get('showers')} mm, codigo={a.get('weather_code')}")
          linhas.append('- Regra cientifica: RGB nao comprova chuva; modelos nao substituem observacoes.')
          resumo = '\n'.join(linhas) + '\n'
          print(resumo)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(resumo)
          PY

      - name: Anexar relatorios JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-multifonte-215
          path: |
            auditoria_geografica_212.json
            auditoria_territorial_213.json
            auditoria_multifonte_215.json
          if-no-files-found: warn
          retention-days: 30
