name: Atualizar dados do Monitor Guaxanduva

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

# Impede duas execuções deste workflow de tentarem gravar
# dados.json, historicos, auditorias e grafo ao mesmo tempo.
concurrency:
  group: monitor-guaxanduva-atualizacao
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow paho-mqtt

      - name: Atualizar dados e históricos
        run: python atualizar_dados.py

      - name: Auditar proveniência temporal CEMADEN
        run: python auditoria_cemaden_170h.py

      - name: Salvar dados, históricos, auditorias e grafo atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dados.json historico_validacao.json historico_guaxanduva_166.json historico_zr_170.json auditoria_temporal_170.json auditoria_cemaden_170h.json historico_cemaden_chuva_170h1.json grafo_guaxanduva.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos dados, históricos, auditorias ou grafo."
            exit 0
          fi

          cp dados.json /tmp/dados-monitor-guaxanduva.json
          cp historico_validacao.json /tmp/historico-validacao-monitor-guaxanduva.json
          cp historico_guaxanduva_166.json /tmp/historico-guaxanduva-166.json
          cp historico_zr_170.json /tmp/historico-zr-170.json
          cp auditoria_temporal_170.json /tmp/auditoria-temporal-170.json
          cp auditoria_cemaden_170h.json /tmp/auditoria-cemaden-170h.json
          cp historico_cemaden_chuva_170h1.json /tmp/historico-cemaden-chuva-170h1.json
          cp grafo_guaxanduva.json /tmp/grafo-guaxanduva.json
          git reset --hard HEAD
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/dados-monitor-guaxanduva.json dados.json
          cp /tmp/historico-validacao-monitor-guaxanduva.json historico_validacao.json
          cp /tmp/historico-guaxanduva-166.json historico_guaxanduva_166.json
          cp /tmp/historico-zr-170.json historico_zr_170.json
          cp /tmp/auditoria-temporal-170.json auditoria_temporal_170.json
          cp /tmp/auditoria-cemaden-170h.json auditoria_cemaden_170h.json
          cp /tmp/historico-cemaden-chuva-170h1.json historico_cemaden_chuva_170h1.json
          cp /tmp/grafo-guaxanduva.json grafo_guaxanduva.json
          git add dados.json historico_validacao.json historico_guaxanduva_166.json historico_zr_170.json auditoria_temporal_170.json auditoria_cemaden_170h.json historico_cemaden_chuva_170h1.json grafo_guaxanduva.json

          if git diff --cached --quiet; then
            echo "Os dados, históricos, auditorias e grafo mais recentes já estão publicados."
            exit 0
          fi

          git commit -m "Atualiza dados, históricos, auditorias e grafo do Monitor Guaxanduva"

          for tentativa in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Dados, históricos, auditorias e grafo publicados com sucesso."
              exit 0
            fi

            echo "Conflito de atualização na tentativa ${tentativa}. Sincronizando novamente..."

            cp dados.json /tmp/dados-monitor-guaxanduva.json
            cp historico_validacao.json /tmp/historico-validacao-monitor-guaxanduva.json
            cp historico_guaxanduva_166.json /tmp/historico-guaxanduva-166.json
            cp historico_zr_170.json /tmp/historico-zr-170.json
            cp auditoria_temporal_170.json /tmp/auditoria-temporal-170.json
            cp auditoria_cemaden_170h.json /tmp/auditoria-cemaden-170h.json
          cp historico_cemaden_chuva_170h1.json /tmp/historico-cemaden-chuva-170h1.json
            cp grafo_guaxanduva.json /tmp/grafo-guaxanduva.json
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/dados-monitor-guaxanduva.json dados.json
            cp /tmp/historico-validacao-monitor-guaxanduva.json historico_validacao.json
            cp /tmp/historico-guaxanduva-166.json historico_guaxanduva_166.json
            cp /tmp/historico-zr-170.json historico_zr_170.json
            cp /tmp/auditoria-temporal-170.json auditoria_temporal_170.json
            cp /tmp/auditoria-cemaden-170h.json auditoria_cemaden_170h.json
          cp /tmp/historico-cemaden-chuva-170h1.json historico_cemaden_chuva_170h1.json
            cp /tmp/grafo-guaxanduva.json grafo_guaxanduva.json
            git add dados.json historico_validacao.json historico_guaxanduva_166.json historico_zr_170.json auditoria_temporal_170.json auditoria_cemaden_170h.json historico_cemaden_chuva_170h1.json grafo_guaxanduva.json

            if git diff --cached --quiet; then
              echo "Os dados, históricos, auditorias e grafo já foram publicados por outra execução."
              exit 0
            fi

            git commit -m "Atualiza dados, históricos, auditorias e grafo do Monitor Guaxanduva"
          done

          echo "Não foi possível publicar após 3 tentativas."
          exit 1
