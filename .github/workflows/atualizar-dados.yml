name: Atualizar dados do Monitor Guaxanduva

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

# Impede duas execuções deste workflow de tentarem gravar
# dados.json e historico_validacao.json ao mesmo tempo.
concurrency:
  group: monitor-guaxanduva-atualizacao
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow

      - name: Atualizar dados e histórico
        run: python atualizar_dados.py

      - name: Salvar dados e histórico atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dados.json historico_validacao.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração em dados.json ou historico_validacao.json."
            exit 0
          fi

          # Guarda os dois arquivos produzidos nesta execução.
          cp dados.json /tmp/dados-monitor-guaxanduva.json
          cp historico_validacao.json /tmp/historico-validacao-monitor-guaxanduva.json

          # Descarta as alterações locais temporariamente para permitir
          # a sincronização segura com a versão mais recente da main.
          git reset --hard HEAD

          # Busca tudo que entrou na main enquanto o radar era processado.
          git fetch origin main
          git reset --hard origin/main

          # Recoloca exclusivamente os arquivos recém-gerados.
          cp /tmp/dados-monitor-guaxanduva.json dados.json
          cp /tmp/historico-validacao-monitor-guaxanduva.json historico_validacao.json
          git add dados.json historico_validacao.json

          # Se outra execução já publicou exatamente estes dados,
          # não há nada para enviar.
          if git diff --cached --quiet; then
            echo "Os dados e o histórico mais recentes já estão publicados."
            exit 0
          fi

          git commit -m "Atualiza dados e histórico do Monitor Guaxanduva"

          # Última proteção contra uma atualização que tenha ocorrido
          # nos poucos instantes entre o fetch e o push.
          for tentativa in 1 2 3; do
            if git push origin HEAD:main; then
              echo "dados.json e historico_validacao.json publicados com sucesso."
              exit 0
            fi

            echo "Conflito de atualização na tentativa ${tentativa}. Sincronizando novamente..."

            cp dados.json /tmp/dados-monitor-guaxanduva.json
            cp historico_validacao.json /tmp/historico-validacao-monitor-guaxanduva.json
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/dados-monitor-guaxanduva.json dados.json
            cp /tmp/historico-validacao-monitor-guaxanduva.json historico_validacao.json
            git add dados.json historico_validacao.json

            if git diff --cached --quiet; then
              echo "Os dados e o histórico já foram publicados por outra execução."
              exit 0
            fi

            git commit -m "Atualiza dados e histórico do Monitor Guaxanduva"
          done

          echo "Não foi possível publicar dados.json e historico_validacao.json após 3 tentativas."
          exit 1
