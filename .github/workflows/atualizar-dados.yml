name: Atualizar dados do Monitor Guaxanduva

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions usa UTC.
    # Executa a cada 15 minutos.
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Atualizar dados
        run: python atualizar_dados.py

      - name: Salvar dados atualizados
        run: |
          git config user.name "Monitor Guaxanduva"
          git config user.email "actions@github.com"

          git add dados.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração."
          else
            git commit -m "Atualização automática dos dados"
            git push
          fi
