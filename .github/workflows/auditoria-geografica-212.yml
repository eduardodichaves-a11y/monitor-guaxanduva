name: Auditoria geografica RadarSC #212

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditar-geografia:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Conferir entradas da auditoria
        run: |
          test -s auditar_cruzamento_geografico_212.py
          test -s dados.json
          python -m py_compile auditar_cruzamento_geografico_212.py

      - name: Executar auditoria geografica 212
        run: |
          python auditar_cruzamento_geografico_212.py dados.json --raio-estacoes-km 25 --saida auditoria_geografica_212.json

      - name: Resumo da auditoria
        run: |
          python - <<'PY'
          import json
          import os
          with open("auditoria_geografica_212.json", encoding="utf-8") as f:
              d = json.load(f)
          linhas = [
              "## Auditoria geografica RadarSC #212",
              f"- Quadro: {d.get('quadro_radar') or 'N/D'}",
              f"- Agrupamentos: {d.get('total_agrupamentos', 0)}",
              "- Estacoes listadas sao candidatas, nao validacoes de chuva.",
              "- Sem agrupamentos, a auditoria nao pode testar pareamento espacial.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\\n".join(linhas) + "\\n")
          print("\\n".join(linhas))
          PY

      - name: Disponibilizar relatorio JSON
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-geografica-212
          path: auditoria_geografica_212.json
          if-no-files-found: error
          retention-days: 30
